name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Tag in Biztactix-Ryan/Timberborn-Stubs to compile against; bump after regenerating stubs.
  TIMBERBORN_VERSION: 1.1.2.8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.key.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      # Secrets aren't passed to pull requests from forks, so those can't fetch the stubs.
      - name: Check for stubs key
        id: key
        env:
          KEY: ${{ secrets.TIMBERBORN_STUBS_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TIMBERBORN_STUBS_KEY is not available; skipping the build."
          fi

      - name: Check out Timberborn reference assemblies
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: Biztactix-Ryan/Timberborn-Stubs
          ref: ${{ env.TIMBERBORN_VERSION }}
          ssh-key: ${{ secrets.TIMBERBORN_STUBS_KEY }}
          path: timberborn

      - uses: actions/setup-dotnet@v4
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Build and package
        if: steps.key.outputs.present == 'true'
        run: scripts/package.sh -p:GamePath="$GITHUB_WORKSPACE/timberborn"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: AdvancedResourceCounter
          path: dist/AdvancedResourceCounter-v*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("Mod/manifest.json"))["Version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: AdvancedResourceCounter
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-notes.sh > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
