name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Tag in Biztactix-Ryan/Timberborn-BuildDLLStubs to compile against; bump after regenerating stubs.
  TIMBERBORN_VERSION: 1.1.2.8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out Timberborn reference assemblies
        uses: actions/checkout@v4
        with:
          repository: Biztactix-Ryan/Timberborn-BuildDLLStubs
          ref: ${{ env.TIMBERBORN_VERSION }}
          path: timberborn

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package
        run: scripts/package.sh -p:GamePath="$GITHUB_WORKSPACE/timberborn"

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedResourceCounter
          path: dist/AdvancedResourceCounter-v*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("Mod/manifest.json"))["Version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: AdvancedResourceCounter
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-notes.sh > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
